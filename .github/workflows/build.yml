name: Build ExcelComparator Setup

on:
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: Build the exe
        run: |
          pyinstaller --onefile --windowed --name "ExcelComparator" --icon=app_icon.ico excel_compare.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelComparatorSetup
          path: Output/ExcelComparatorSetup.exe

      - name: Upload the raw exe too (optional, no installer)
        uses: actions/upload-artifact@v4
        with:
          name: ExcelComparator-exe-only
          path: dist/ExcelComparator.exe
